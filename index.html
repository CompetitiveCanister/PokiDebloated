<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokiDebloated - Game Directory</title>
  
  <!-- JSZip Library for in-browser zipping -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-canvas: #0d1117;
      --bg-subtle: #161b22;
      --bg-card: #161b22;
      --bg-card-hover: #1c2128;
      --border-default: #30363d;
      --border-muted: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --badge-bg: #1f6feb22;
      --badge-border: #388bfd44;
      --badge-text: #58a6ff;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border-default);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .repo-breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }
    .repo-breadcrumb a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
    .repo-breadcrumb a:hover { text-decoration: underline; }
    .repo-breadcrumb span { color: var(--text-secondary); }

    .github-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: var(--text-primary); text-decoration: none; font-size: 0.85rem;
      padding: 0.3rem 0.6rem; background-color: var(--border-muted);
      border: 1px solid var(--border-default); border-radius: 6px;
      transition: background 0.15s;
    }
    .github-link:hover { background-color: #30363d; }

    /* Hero & Search */
    .hero { max-width: 960px; width: 100%; margin: 0 auto; padding: 2.5rem 1rem 1.5rem 1rem; }
    .hero h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; }

    .controls-row { display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 640px) {
      .controls-row { flex-direction: row; justify-content: space-between; align-items: flex-start; }
    }

    .search-box { position: relative; flex: 1; max-width: 400px; }
    .search-box input {
      width: 100%; background-color: var(--bg-canvas); border: 1px solid var(--border-default);
      border-radius: 6px; color: var(--text-primary); padding: 0.45rem 0.75rem; font-size: 0.9rem;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2); }

    .filter-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; flex: 2; justify-content: flex-end; }
    .filter-btn {
      background: none; 
      border: 1px solid var(--border-default); 
      border-radius: 20px;
      color: var(--text-secondary); 
      padding: 0.25rem 0.75rem; 
      font-size: 0.8rem;
      cursor: pointer; 
      transition: all 0.15s; 
      text-transform: capitalize;
      user-select: none;
    }
    .filter-btn:hover { 
      border-color: var(--text-secondary); 
      color: var(--text-primary); 
    }
    .filter-btn.active[data-filter="all"] { 
      background-color: var(--border-default); 
      border-color: var(--border-default);
      color: var(--text-primary); 
      font-weight: 600; 
    }
    .filter-btn.active { 
      background-color: var(--badge-bg); 
      border-color: var(--accent-blue); 
      color: var(--accent-blue); 
      font-weight: 600; 
    }

    /* Grid & Cards */
    main { max-width: 960px; width: 100%; margin: 0 auto; padding: 0 1rem 3rem 1rem; flex: 1; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

    .game-card {
      background-color: var(--bg-card); border: 1px solid var(--border-default); border-radius: 6px;
      display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.15s, background-color 0.15s;
    }
    .game-card:hover { border-color: var(--text-secondary); background-color: var(--bg-card-hover); }

    .card-banner { height: 120px; background-color: #010409; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-muted); }
    .card-banner img { max-height: 80px; max-width: 80px; object-fit: contain; border-radius: 8px; }

    .card-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.35rem; }
    .card-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 1rem; flex: 1; }

    .card-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
    .badge {
      font-family: var(--font-mono); font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 12px;
      background-color: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--badge-text);
      text-transform: capitalize;
    }

    /* Button Group Styling */
    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }

    /* GitHub Green Play Button */
    .play-btn {
      flex: 1;
      padding: 0.45rem 0.6rem;
      background-color: var(--accent-green);
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
    }
    .play-btn:hover {
      background-color: var(--accent-green-hover);
    }

    /* GitHub Slate Download Button (Square) */
    .download-btn {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      padding: 0;
      background-color: var(--border-muted);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      cursor: pointer;
    }
    .download-btn:hover:not(:disabled) {
      background-color: #30363d;
      border-color: var(--text-secondary);
    }
    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .download-btn svg {
      fill: currentColor;
    }

    /* Spinner Animation for Download */
    .spinner {
      animation: spin 1s linear infinite;
      color: var(--text-primary);
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Loading / Error States */
    .status-msg { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    
    .skeleton { animation: pulse 1.5s infinite; background-color: var(--border-muted); border-radius: 4px; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 0.2; } 100% { opacity: 0.6; } }
    .skel-card { height: 300px; border-radius: 6px; display: flex; flex-direction: column; gap: 1rem; background-color: var(--bg-card); border: 1px solid var(--border-default); padding-bottom: 1rem;}
    .skel-banner { height: 120px; width: 100%; }
    .skel-title { height: 20px; width: 60%; margin: 0 1rem; }
    .skel-desc { height: 40px; width: 85%; margin: 0 1rem; }
    .skel-btn { height: 30px; width: calc(100% - 2rem); margin: auto 1rem 0 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="repo-breadcrumb">
      <svg height="18" viewBox="0 0 16 16" width="18" fill="currentColor" style="color: var(--text-secondary);"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h6.5a.25.25 0 0 1 .25.25v1.5a.25.25 0 0 1-.25.25h-6.5a.25.25 0 0 1-.25-.25Z"></path></svg>
      <a href="#">CompetitiveCanister</a>
      <span>/</span>
      <a href="#">PokiDebloated</a>
    </div>
    <a href="https://github.com/CompetitiveCanister/PokiDebloated" target="_blank" class="github-link">
      <svg height="14" viewBox="0 0 16 16" width="14" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
      GitHub
    </a>
  </header>

  <section class="hero">
    <h1>Game Directory</h1>
    <p>Debloated and offline-ready web games hosted on GitHub Pages.</p>
    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search games... (Press '/' to focus)" autocomplete="off" />
      </div>
      <div class="filter-tags" id="filterContainer">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>
    </div>
  </section>

  <main>
    <div class="game-grid" id="gameGrid">
      <div class="skel-card"><div class="skeleton skel-banner"></div><div class="skeleton skel-title"></div><div class="skeleton skel-desc"></div><div class="skeleton skel-btn"></div></div>
      <div class="skel-card"><div class="skeleton skel-banner"></div><div class="skeleton skel-title"></div><div class="skeleton skel-desc"></div><div class="skeleton skel-btn"></div></div>
      <div class="skel-card"><div class="skeleton skel-banner"></div><div class="skeleton skel-title"></div><div class="skeleton skel-desc"></div><div class="skeleton skel-btn"></div></div>
    </div>
  </main>

  <script>
    // Configuration
    const REPO_OWNER = 'CompetitiveCanister';
    const REPO_NAME = 'PokiDebloated';
    const BRANCH = 'main';
    const GAMES_DIR_PATH = 'games';

    const grid = document.getElementById('gameGrid');
    const filterContainer = document.getElementById('filterContainer');
    const searchInput = document.getElementById('searchInput');

    let allGames = [];
    let allTags = new Set();
    let selectedTags = new Set();

    async function loadGames() {
      try {
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${GAMES_DIR_PATH}?ref=${BRANCH}`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) throw new Error("Could not fetch repository contents.");
        
        const contents = await response.json();
        const folders = contents.filter(item => item.type === 'dir').map(dir => dir.name);

        const gamePromises = folders.map(async (folder) => {
          try {
            const infoRes = await fetch(`${GAMES_DIR_PATH}/${folder}/info.json`);
            if (!infoRes.ok) return null;
            const info = await infoRes.json();
            return { folder, ...info };
          } catch (e) {
            return null;
          }
        });

        const results = await Promise.all(gamePromises);
        allGames = results.filter(game => game !== null);

        if (allGames.length === 0) {
          grid.innerHTML = '<div class="status-msg">No valid games found.</div>';
          return;
        }

        allGames.forEach(game => {
          (game.tags || []).forEach(t => allTags.add(t.toLowerCase()));
        });

        generateFilters();
        renderGames();

      } catch (error) {
        console.error(error);
        grid.innerHTML = `<div class="status-msg">Error loading games: ${error.message}</div>`;
      }
    }

    function renderGames() {
      grid.innerHTML = '';
      let visibleCount = 0;
      const query = searchInput.value.toLowerCase().trim();

      allGames.forEach(game => {
        const gameTags = (game.tags || []).map(t => t.toLowerCase());
        const textToSearch = `${game.title} ${game.description}`.toLowerCase();
        const matchesQuery = textToSearch.includes(query);
        const matchesFilter = selectedTags.size === 0 || Array.from(selectedTags).every(tag => gameTags.includes(tag));

        if (matchesQuery && matchesFilter) {
          visibleCount++;

          let iconPath;
          if (!game.icon) {
            iconPath = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="%2330363d"><rect width="80" height="80"/></svg>';
          } else if (game.icon.startsWith('http://') || game.icon.startsWith('https://') || game.icon.startsWith('data:')) {
            iconPath = game.icon;
          } else {
            iconPath = `${GAMES_DIR_PATH}/${game.folder}/${game.icon}`;
          }

          const badgesHtml = gameTags.map(tag => `<span class="badge">${tag}</span>`).join('');

          const cardHtml = `
            <div class="game-card">
              <div class="card-banner">
                <img src="${iconPath}" alt="${game.title} icon" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\' fill=\'%2330363d\'><rect width=\'80\' height=\'80\'/></svg>'" />
              </div>
              <div class="card-body">
                <div class="card-title">${game.title || game.folder}</div>
                <p class="card-desc">${game.description || 'No description provided.'}</p>
                <div class="card-badges">${badgesHtml}</div>
                
                <div class="card-actions">
                  <a href="${GAMES_DIR_PATH}/${game.folder}/" class="btn play-btn">Play</a>
                  <button onclick="downloadGame(this, '${game.folder}', '${game.title || game.folder}')" class="btn download-btn" title="Download ZIP for offline play">
                    <svg height="16" viewBox="0 0 16 16" width="16">
                      <path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path>
                      <path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.749.749 0 1 1 1.06 1.06l-3.25 3.25a.749.749 0 0 1-1.06 0L4.22 6.78a.749.749 0 1 1 1.06-1.06l1.97 1.969Z"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHtml);
        }
      });

      if (visibleCount === 0) {
        grid.innerHTML = '<div class="status-msg">No games match your search or filter combination.</div>';
      }
    }

    // Invisible Zipping Logic
    async function downloadGame(btn, folder, title) {
      if (btn.disabled) return;
      
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      // Swap icon to a spinner
      btn.innerHTML = `<svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>`;

      try {
        // 1. Fetch entire repository tree to find all files recursively
        const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
        const treeRes = await fetch(treeUrl);
        if (!treeRes.ok) throw new Error("Failed to read repository structure.");
        const treeData = await treeRes.json();

        // 2. Filter out only the files that belong to this specific game
        const prefix = `${GAMES_DIR_PATH}/${folder}/`;
        const filesToDownload = treeData.tree.filter(item => item.type === 'blob' && item.path.startsWith(prefix));

        if (filesToDownload.length === 0) throw new Error("No files found to download.");

        // 3. Initialize JSZip and fetch all files in parallel
        const zip = new JSZip();
        const fetchPromises = filesToDownload.map(async (file) => {
          const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${file.path}`;
          const fileRes = await fetch(rawUrl);
          if (!fileRes.ok) throw new Error(`Failed to fetch ${file.path}`);
          
          const arrayBuffer = await fileRes.arrayBuffer();
          
          // Add file to ZIP, maintaining the folder structure (e.g., 'tag/index.html')
          const zipPath = file.path.replace(`${GAMES_DIR_PATH}/`, '');
          zip.file(zipPath, arrayBuffer);
        });

        await Promise.all(fetchPromises);

        // 4. Generate the ZIP file locally
        const blob = await zip.generateAsync({ type: "blob" });
        
        // 5. Trigger the browser download prompt
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        // Format the filename beautifully: "temple_of_boom.zip"
        a.download = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.zip`;
        document.body.appendChild(a);
        a.click();
        
        // Clean up
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

      } catch (error) {
        console.error(error);
        alert(`Error downloading ${title}: ${error.message}`);
      } finally {
        // Restore button state
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    function generateFilters() {
      filterContainer.innerHTML = '<button class="filter-btn active" data-filter="all">All</button>';
      
      const sortedTags = Array.from(allTags).sort();
      sortedTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-filter', tag);
        btn.textContent = tag;
        filterContainer.appendChild(btn);
      });

      filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const filter = e.target.getAttribute('data-filter');
          const allBtn = filterContainer.querySelector('[data-filter="all"]');

          if (filter === 'all') {
            selectedTags.clear();
            filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            allBtn.classList.add('active');
          } else {
            allBtn.classList.remove('active');
            if (selectedTags.has(filter)) {
              selectedTags.delete(filter);
              e.target.classList.remove('active');
            } else {
              selectedTags.add(filter);
              e.target.classList.add('active');
            }
            if (selectedTags.size === 0) {
              allBtn.classList.add('active');
            }
          }
          renderGames();
        });
      });
    }

    searchInput.addEventListener('input', renderGames);

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    document.addEventListener('DOMContentLoaded', loadGames);
  </script>
</body>
</html>
