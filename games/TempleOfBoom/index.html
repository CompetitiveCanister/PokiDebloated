<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Temple of Boom</title>
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="shortcut icon" type="image/png" href="./favicon.png">

    <!-- 1. Mock PokiSDK so the game loads smoothly without contacting Poki's ad servers -->
    <script>
        window.PokiSDK = {
            init: function() { return Promise.resolve(); },
            gameLoadingStart: function() {},
            gameLoadingFinished: function() {},
            gameLoadingProgress: function() {},
            gameplayStart: function() {},
            gameplayStop: function() {},
            commercialBreak: function() { return Promise.resolve(); },
            rewardedBreak: function() { return Promise.resolve(true); },
            displayAd: function() {},
            destroyAd: function() {}
        };
    </script>

    <!-- 2. Game Engine Scripts -->
    <script type="text/javascript" src="./TempleBoom_CustomPreloader_ForColin.js"></script>

    <script>
        window.addEventListener("touchmove", function(event) {
            event.preventDefault();
        }, {
            capture: false,
            passive: false
        });

        // Fixed viewport setter
        if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
            var meta = document.getElementById("viewport");
            if (meta) {
                meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
            }
        }
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        #noncontent {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scales the game canvas cleanly while keeping its aspect ratio */
        #noncontent canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div id="noncontent"></div>

    <script type="text/javascript">
        lime.embed("TempleBoom_CustomPreloader_ForColin", "noncontent", 624, 400);
    </script>

</body>
</html>
